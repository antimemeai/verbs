[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pverbs"
version = "0.1.0"
description = "Explicit, named constraints for more verifiable agent-written code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Patrick Beam"}]
keywords = ["constraints", "validation", "agents", "contracts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/antimemeai/verbs"
Repository = "https://github.com/antimemeai/verbs"
Issues = "https://github.com/antimemeai/verbs/issues"

[tool.setuptools]
packages = ["pverbs"]

[tool.setuptools.package-data]
pverbs = ["py.typed"]
